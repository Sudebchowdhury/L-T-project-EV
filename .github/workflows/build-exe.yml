name: Test and build Windows .exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach the .exe to a GitHub Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest -v

      - name: Build exe
        run: pyinstaller --noconfirm --onefile --windowed --name CO2Comparator --icon icon.ico --add-data "icon.ico;." --collect-all customtkinter main.py

      - uses: actions/upload-artifact@v4
        with:
          name: CO2Comparator-windows
          path: dist/CO2Comparator.exe

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CO2Comparator.exe
